pre-commit:
  parallel: true
  commands:
    format:
      glob: '*.{js,jsx,ts,tsx,json,jsonc,html,css,scss,sass,less,pcss,postcss,md,yml,yaml}'
      run: bunx oxfmt --write {staged_files}
      stage_fixed: true
    oxlint:
      glob: '*.{js,jsx,ts,tsx}'
      run: bunx oxlint --deny-warnings {staged_files}
    stylelint:
      glob: '*.{css,scss,sass,less,pcss,postcss}'
      run: bun run --if-present lint:styles:staged -- {staged_files}

commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}

pre-push:
  commands:
    quality-fast:
      run: bun run quality:fast
